name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    name: Back end · Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]   # 3.9 is the Mac's built-in Python (Django 4.2); 3.12 gets Django 5.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m pyflakes renderer letterstudio tools tests_ui run_local.py manage.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Front end · types, lint, unit tests
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run typecheck
          npm --prefix frontend run lint
          npm --prefix frontend run test
      - name: Page is built from frontend/
        run: |
          python tools/build_frontend.py
          git diff --exit-code renderer/frontend/index.html || (echo "Run python tools/build_frontend.py and commit renderer/frontend/index.html" && exit 1)
      - run: python manage.py check
      - name: Tests
        run: python manage.py test renderer -v 2

  page:
    name: Page · parity and click-through
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Parity with the old page
        run: python tests_ui/parity.py
      # Every letter x view x step, every button, Conditions end to end, downloads, bad files, team library, phone width
      - name: Click-through sweep of the React page
        run: python tests_ui/sweep.py
      - name: Smoke tests (export, validate, Assistant, Edit letter, combine, tag fixes)
        run: |
          python tests_ui/react/export.py
          python tests_ui/react/validate.py
          python tests_ui/react/assistant.py
          python tests_ui/react/editor.py
          python tests_ui/react/combine.py
          python tests_ui/react/tagfix.py
